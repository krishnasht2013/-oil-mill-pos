{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-4">Record New Production</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Mustard Seeds Used (Kg)</label>
                    <input type="number" step="0.01" name="seeds" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Oil Produced (Litre)</label>
                    <input type="number" step="0.01" name="oil" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Oil Cake Produced (Kg)</label>
                    <input type="number" step="0.01" name="cake" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 p-2">Save Production Log</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
