{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="text-center mb-4">Current Stock Inventory</h3>
            <table class="table table-bordered text-center">
                <thead class="table-light">
                    <tr class="fw-bold">
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in stock %}
                    <tr>
                        <td class="fw-bold">{{ item.name }}</td>
                        <td class="fs-5">{{ item.quantity }}</td>
                        <td>{{ item.unit }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
